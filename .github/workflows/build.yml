name: Build and Release

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================
  # Job 1: 代码检查与单元测试
  # ============================================================
  check-and-test:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "stable"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy lint
        run: cargo clippy --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

  # ============================================================
  # Job 2: 多平台构建
  # ============================================================
  build:
    name: Build ${{ matrix.artifact }}
    needs: check-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            features: windows
            artifact: udp-knock-windows-x86_64.exe
            cross: false
            upx: false

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: linux
            artifact: udp-knock-linux-x86_64
            cross: false
            upx: true

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            features: openwrt
            artifact: udp-knock-openwrt-aarch64
            cross: true
            upx: true

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            features: openwrt
            artifact: udp-knock-openwrt-x86_64
            cross: true
            upx: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "stable"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.features }}

      # Native build
      - name: Build (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          EXT=""
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then EXT=".exe"; fi
          cargo build --release --target ${{ matrix.target }} --features ${{ matrix.features }}
          echo "BUILD_OUTPUT=target/${{ matrix.target }}/release/udp-knock${EXT}" >> $GITHUB_ENV

      # Cross build for Musl targets
      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build (cross)
        if: ${{ matrix.cross }}
        run: |
          cross build --release --target ${{ matrix.target }} --features ${{ matrix.features }}
          echo "BUILD_OUTPUT=target/${{ matrix.target }}/release/udp-knock" >> $GITHUB_ENV

      # UPX binary compression
      - name: Compress with UPX
        if: ${{ matrix.upx }}
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest

      - name: Run UPX
        if: ${{ matrix.upx }}
        run: |
          upx --best --lzma "${{ env.BUILD_OUTPUT }}" || echo "UPX failed, keeping original"
          ls -lh "${{ env.BUILD_OUTPUT }}"

      # Package artifact & SHA256 checksum
      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ env.BUILD_OUTPUT }}" "dist/${{ matrix.artifact }}"
          cd dist
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          cat "${{ matrix.artifact }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          retention-days: 30

  # ============================================================
  # Job 3: 每次构建自动创建 Release (版本号格式: Vx.y.nn-yyyymmdd)
  # ============================================================
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Version Tag
        id: version
        shell: bash
        run: |
          # 1. 从项目根目录 version.txt 读取 x.y (例如 0.1)
          XY=$(cat version.txt | tr -d '\r\n ')
          if [ -z "$XY" ]; then XY="0.1"; fi

          # 2. 从 github.run_number 格式化自增序列号 (补齐2位数字，如 01, 02...)
          NN=$(printf "%02d" "${{ github.run_number }}")

          # 3. 获取 UTC 当前日期 yyyymmdd (例如 20260807)
          DATE=$(date -u +%Y%m%d)

          # 组合版本号: Vx.y.nn-yyyymmdd
          VERSION_TAG="V${XY}.${NN}-${DATE}"
          echo "tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "Generated Version Tag: ${VERSION_TAG}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "UDP Knock ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          files: |
            dist/udp-knock-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
