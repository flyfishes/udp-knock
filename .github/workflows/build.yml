name: Build & Release

on:
  # 1. Tag 推送触发发布
  push:
    tags:
      - 'v*'
      - 'v*.*'
      - 'v*.*.*'
  
  # 2. PR 触发检查（仅针对默认分支）
  pull_request:
    branches:
      - main
  
  # 3. 直接推送到默认分支也触发检查
  push:
    branches:
      - main
      - master
  
  # 4. 手动触发（带可选参数）
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force create release (skip tag check)'
        required: false
        default: 'false'
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  # ============================================================
  # Job 1: 代码检查与测试
  # ============================================================
  check-and-test:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy lint
        run: cargo clippy --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

  # ============================================================
  # Job 2: 多平台构建
  # ============================================================
  build:
    name: Build ${{ matrix.artifact }}
    needs: check-and-test
    # 仅在 tag 推送或手动强制发布时构建
    if: |
      startsWith(github.ref, 'refs/tags/v') || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.force_release == 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            features: windows
            artifact: udp-knock-windows-x86_64.exe
            cross: false
            upx: false

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: linux
            artifact: udp-knock-linux-x86_64
            cross: false
            upx: true

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            features: openwrt
            artifact: udp-knock-openwrt-aarch64
            cross: true
            upx: true

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            features: openwrt
            artifact: udp-knock-openwrt-x86_64
            cross: true
            upx: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.features }}

      # Native build
      - name: Build (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          EXT=""
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then EXT=".exe"; fi
          cargo build --release --target ${{ matrix.target }} --features ${{ matrix.features }}
          echo "BUILD_OUTPUT=target/${{ matrix.target }}/release/udp-knock${EXT}" >> $GITHUB_ENV

      # Cross build
      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build (cross)
        if: ${{ matrix.cross }}
        run: |
          cross build --release --target ${{ matrix.target }} --features ${{ matrix.features }}
          echo "BUILD_OUTPUT=target/${{ matrix.target }}/release/udp-knock" >> $GITHUB_ENV

      # UPX compression
      - name: Compress with UPX
        if: ${{ matrix.upx }}
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest

      - name: Run UPX
        if: ${{ matrix.upx }}
        run: |
          upx --best --lzma "${{ env.BUILD_OUTPUT }}" || echo "UPX failed, keeping original"
          ls -lh "${{ env.BUILD_OUTPUT }}"

      # Package
      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ env.BUILD_OUTPUT }}" "dist/${{ matrix.artifact }}"
          cd dist
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          cat "${{ matrix.artifact }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          retention-days: 30

  # ============================================================
  # Job 3: 创建 Release
  # ============================================================
  release:
    name: Create Release
    needs: build
    if: |
      startsWith(github.ref, 'refs/tags/v') || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.force_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=manual-$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "version=${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "UDP Knock ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            dist/udp-knock-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}