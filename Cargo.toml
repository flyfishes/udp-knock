[package]
name = "udp-knock"
version = "0.1.0"
edition = "2021"
authors = ["UDP Knock Authors"]
description = "A secure remote firewall management tool using encrypted UDP packets"

[features]
default = ["openwrt"]
openwrt = []
linux = []
windows = []

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
